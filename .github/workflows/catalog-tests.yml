name: Catalog tests
on:
  pull_request:
    paths: ['catalog/**', 'tests/catalog.test.mjs', 'tests/deployment-config.test.mjs', 'tests/generate-request.test.mjs', 'tests/clean-install.test.mjs', 'tests/github-token.test.cjs', 'services/githubService.js', 'config.js', '.github/workflows/scripts/generate_request.mjs', '.github/workflows/self-service-custom-infra.yml', '.github/workflows/scripts/validate_azure_target.mjs', '.github/workflows/terraform-iac.yml', '.github/workflows/catalog-tests.yml']
  push:
    branches: [main]
    paths: ['catalog/**', 'tests/catalog.test.mjs', 'tests/deployment-config.test.mjs', 'tests/generate-request.test.mjs', 'tests/clean-install.test.mjs', 'tests/github-token.test.cjs', 'services/githubService.js', 'config.js', '.github/workflows/scripts/**', '.github/workflows/self-service-custom-infra.yml', '.github/workflows/terraform-iac.yml', '.github/workflows/catalog-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/catalog.test.mjs tests/deployment-config.test.mjs tests/generate-request.test.mjs tests/clean-install.test.mjs tests/github-token.test.cjs
