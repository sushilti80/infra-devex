name: Catalog tests
on:
  pull_request:
    paths: ['service-catalog/catalog/**', 'service-catalog/tests/catalog.test.mjs', '.github/workflows/catalog-tests.yml']
  push:
    branches: [main]
    paths: ['service-catalog/catalog/**', 'service-catalog/tests/catalog.test.mjs', '.github/workflows/catalog-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test service-catalog/tests/catalog.test.mjs
