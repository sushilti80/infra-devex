name: Wiz Scan

# Minimal Wiz CLI code/IaC/SCA directory scan. Fails the job on Wiz policy failure.
# Requires WIZ_CLIENT_ID / WIZ_CLIENT_SECRET (singular) to be visible to this repo
# (repo secret, or an org secret shared with organization/self-service-infra).
# Image scan (`wizcli scan container-image`) is intentionally out of scope here.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/**'
      - 'routes/**'
      - 'srcV2/**'
      - 'utils/**'
      - 'package*.json'
      - 'Dockerfile'

permissions:
  contents: read

concurrency:
  group: wiz-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pinned version + checksum used by organization/docker-infra-live (src/adoagent/base/Dockerfile).
  WIZ_CLI_VERSION: '1.77.0'
  WIZ_CLI_SHA256: '609ce7bb2faf755e336553dbc0c15bdbe9717c617db572ee5b5f765154a8dca3'

jobs:
  wiz-dir-scan:
    name: Wiz directory scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs never receive secrets; skip them rather than fail on missing credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Wiz CLI (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/wizcli "https://downloads.wiz.io/v1/wizcli/${WIZ_CLI_VERSION}/wizcli-linux-amd64"
          echo "${WIZ_CLI_SHA256}  /tmp/wizcli" | sha256sum --check --status
          sudo install -m 0755 /tmp/wizcli /usr/local/bin/wizcli
          wizcli version

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          if [ -z "${WIZ_CLIENT_ID}" ] || [ -z "${WIZ_CLIENT_SECRET}" ]; then
            echo "::error::WIZ_CLIENT_ID / WIZ_CLIENT_SECRET are not visible to this repository (grant the org secrets to organization/self-service-infra, or add them as repo secrets)."
            exit 1
          fi
          wizcli auth --id "${WIZ_CLIENT_ID}" --secret "${WIZ_CLIENT_SECRET}"

      - name: Wiz directory scan (code / IaC / SCA / secrets)
        # The job fails (non-zero exit) on a Wiz BLOCK policy hit; default output lists BLOCK hits only.
        # A second, non-gating, unpublished pass lists AUDIT (warn) hits so reviewers can see them.
        # JSON stays in /tmp (never uploaded); only per-severity counts are echoed.
        run: |
          NAME="self-service-infra-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          rc=0
          wizcli scan dir . --name "${NAME}" --no-color --no-style --json-output-file /tmp/wiz-dir.json || rc=$?
          echo "wizcli exit code: ${rc}"
          jq -c '[.. | objects | select(has("severity")) | .severity] | group_by(.) | map({(.[0] | tostring): length}) | add // {}' /tmp/wiz-dir.json 2>/dev/null | sed 's/^/severity counts (BLOCK-filtered result, best effort): /' || true
          echo "--- non-gating pass: AUDIT (warn) policy hits ---"
          wizcli scan dir . --name "${NAME}-audit" --no-color --no-style --no-publish --by-policy-hits=AUDIT --json-output-file /tmp/wiz-dir-audit.json || true
          jq -c '[.. | objects | select(has("severity")) | .severity] | group_by(.) | map({(.[0] | tostring): length}) | add // {}' /tmp/wiz-dir-audit.json 2>/dev/null | sed 's/^/severity counts (AUDIT hits, best effort): /' || true
          exit "${rc}"
