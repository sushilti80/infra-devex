name: Agent Governance

on:
  pull_request:
    paths:
      - '.agent/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/agent-memory/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/workflows/agent-governance.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  copilot-requests: write

jobs:
  agent-governance:
    uses: Aya-DevOpsTeam/agent-governance/.github/workflows/agent-governance.yml@v2026.09.12
    secrets:
      governance_app_client_id: ${{ secrets.AGENT_GOVERNANCE_APP_CLIENT_ID }}
      governance_app_private_key: ${{ secrets.AGENT_GOVERNANCE_APP_PRIVATE_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
