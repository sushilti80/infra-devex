variables:
  - group: azdevopsterraform
  - name: environments
    value: 'sand|devsand'

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'recycle-bin/**/devsand/**'
      - 'recycle-bin/**/sand/**'

pr: none

stages:
  - stage: TerraformDestroy
    displayName: 'Terraform Destroy Infrastructure'
    jobs:
      - job: DestroyInfra
        displayName: 'Destroy Infra'
        timeoutInMinutes: 120
        pool:
          name: example-agent-pool-1
        steps:

          - task: InstallSSHKey@0
            inputs:
              knownHostsEntry: '$(ssh_known_hosts)'
              sshPublicKey: '$(myPubKey)'
              sshKeySecureFile: 'id_rsa'

          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true
            displayName: 'Checkout code'

          - script: |
              echo "Syncing repository after merge..."
              git fetch origin main
              git reset --hard origin/main
            displayName: 'Sync Repository to Main Branch'

          - script: |
              echo "Current commit SHA: $(Build.SourceVersion)"

              git fetch --all

              PREV_COMMIT=$(git rev-parse $(Build.SourceVersion)^1)
              echo "Previous commit SHA: $PREV_COMMIT"

              echo "Commit history for debugging:"
              git log --oneline -5

              git diff --name-only $PREV_COMMIT $(Build.SourceVersion) | grep '^recycle-bin/' > changed_files.txt

              echo "Changed files under recycle-bin/:"
              cat changed_files.txt

              awk -F'/' -v envs="$ENVIRONMENTS" '
              {
                  for (i=1; i<=NF; i++) {
                      if ($i ~ envs) {
                          path = $1;
                          for (j=2; j<=i; j++) path = path "/" $j;
                          print path;
                          break;
                      }
                  }
              }' changed_files.txt | sort -u > changed_dirs.txt

              echo "Filtered directories matching environments:"
              cat changed_dirs.txt

              if [ ! -s changed_dirs.txt ]; then
                echo "No relevant changes detected. Exiting pipeline."
                exit 0
              fi
            displayName: 'Detect and Filter Recycle-bin Directories (Robust)'
            env:
              ENVIRONMENTS: $(environments)

          - template: destroy/destroy_pr_checks.yaml
            parameters:
              basepath: .pipelines/infrastructure
