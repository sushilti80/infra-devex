parameters:
  directorypath: ''
  env: ''

steps:
- script: |
    # Install jq on Linux agents
    echo "Installing jq..."
    # sudo apt-get update
    sudo apt-get install -y jq
    # Verify jq installation
    jq --version
  displayName: 'Install dependencies'

- script: |
    # Initialize empty Apply_errors.md and Apply_success.md files
    echo "# Terraform Apply Errors" > $(System.DefaultWorkingDirectory)/Apply_errors.md
    echo "# Terraform Apply Success" > $(System.DefaultWorkingDirectory)/Apply_success.md
    echo "# Combined Apply Results" > $(System.DefaultWorkingDirectory)/Apply_combined.md

    while read -r dir; do
      echo "Processing directory: $dir"

      cd $dir
      terragrunt run-all refresh -no-color -compact-warnings

      terragrunt run --all --non-interactive --parallelism 1 -- apply -lock=false

    done < $(System.DefaultWorkingDirectory)/changed_dirs.txt

  displayName: 'Apply Terraform'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

- script: |
    request_list="$(System.DefaultWorkingDirectory)/module_removal_requests.txt"
    if [[ ! -s "$request_list" ]]; then
      echo "No removed modules to destroy."
      exit 0
    fi

    bash "$(System.DefaultWorkingDirectory)/.pipelines/infrastructure/deploy/destroy_removed_modules.sh" \
      "$request_list" \
      "$(System.DefaultWorkingDirectory)"
  displayName: 'Destroy Removed Terraform Modules'
