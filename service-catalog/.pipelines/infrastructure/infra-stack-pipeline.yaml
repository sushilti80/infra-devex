trigger: none
pr: none

pool: aks

parameters:
  - name: directorypath
    type: object
    default:
      _template: infrastructure/_template
      # connect: infrastructure/exampleAppServices/connect
      # eum: infrastructure/exampleAppServices/eum
      # hubspot: infrastructure/exampleAppServices/hubspot
      # integrations: infrastructure/exampleAppServices/integrations
      # jobsuggestionengine: infrastructure/exampleAppServices/jobsuggestionengine
      # webapp-basic: infrastructure/exampleAppServices/webapp-basic
      # locums: infrastructure/exampleAppServices/locums
  - name: env
    type: string
    default: sand


variables:
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
- group: azdevopsterraform

