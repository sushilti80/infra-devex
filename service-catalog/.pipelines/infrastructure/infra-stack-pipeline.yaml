# Destroy stages for sand and POC environments
- ${{ each app in parameters.directorypath }}:
  - stage: Destroy${{ app.key }}
    # dependsOn: Deploy${{ app.key }}
    # condition: and(succeeded(), or(eq('${{ parameters.env }}', 'sand'), eq('${{ parameters.env }}', 'POC')), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DestroyJob${{ app.key }}
        environment: ${{ parameters.env }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /.pipelines/infrastructure/destroy/destroy_stack.yaml
                  parameters:
                    directorypath: ${{ app.value }}
                    env: ${{ parameters.env }}
