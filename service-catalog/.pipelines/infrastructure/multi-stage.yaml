variables:
  # environments: 'sand|devsand'  # List of environments
- group: azdevopsterraform
- name:  environments
  value: 'sand|devsand'

pr: # none
  branches:
    include:
      - 'main'
  paths:
    include:
      - 'infrastructure/**/devsand/**'
      - 'infrastructure/**/sand/**'

stages:
  - stage: TerraformPlan
    jobs:
    - job: GenerateReports
      displayName: 'Generate Infra Docs'
      timeoutInMinutes: 240
      pool:
        name: example-devops-vmss-2
      steps:

      - task: InstallSSHKey@0
        inputs:
          knownHostsEntry: '$(ssh_known_hosts)'
          sshPublicKey: '$(myPubKey)'
          sshKeySecureFile: 'id_rsa'

      - checkout: self
        clean: true
        fetchDepth: 0
        persistCredentials: true
        displayName: 'Checkout code'

      - script: |
          if [ "$(Build.Reason)" == "PullRequest" ]; then
            # Explicitly fetch and checkout the PR's source branch
            git fetch origin $(System.PullRequest.SourceBranch)
            git checkout $(System.PullRequest.SourceBranch)
            git pull --rebase origin $(System.PullRequest.SourceBranch)
          else
            # For non-PR builds, just pull the latest changes on the current branch
            git pull --rebase origin $(Build.SourceBranch)
          fi
        displayName: 'Sync with Remote Repository'
        condition: succeeded()

      - script: |
          echo "Fetching changed files..."
          git diff --name-only origin/main...HEAD | grep '^infrastructure/' > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

          # Define the regex pattern for the environments
          env_regex="($(environments))\$"

          # Extract directory paths, filter by environment, and ensure uniqueness
          #awk '{print $1}' changed_files.txt | xargs -I {} dirname {} | grep -P "$env_regex" | sort | uniq > changed_dirs.txt

          # Extract unique root/application/environment paths
          # Extract unique root/application/environment paths
          awk -F'/' -v envs="$env_regex" '
          {
              for (i=1; i<=NF; i++) {
                  if ($i ~ envs) {
                      path = $1;
                      for (j=2; j<=i; j++) {
                          path = path "/" $j;
                      }
                      print path;
                      break;
                  }
              }
          }' changed_files.txt | sort | uniq > changed_dirs.txt

          echo "Filtered directories with changes (matched by environment):"
          cat changed_dirs.txt

          if [ -s changed_dirs.txt ]; then
            echo "Processing changes in the following directories..."

            # Additional commands for processing directories
          else
            echo "No changes detected in relevant environment directories."
            exit 0
          fi

        displayName: 'List all Changed Directories'
        env:
          environments: $(environments)  # Passing variable correctly

      - template: build/plan_pr_checks.yaml
        parameters:
          basepath: .pipelines/infrastructure

  - stage: ApplyTerraform
    dependsOn: TerraformPlan
    condition: |
      and(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main')
      )
    jobs:
    - deployment: DeployAndApplyTerraform
      environment: boilerplates
      pool: example-devops-vmss-1
      strategy:
        runOnce:
          deploy:
            steps:
            - task: InstallSSHKey@0
              inputs:
                knownHostsEntry: '$(ssh_known_hosts)'
                sshPublicKey: '$(myPubKey)'
                sshKeySecureFile: '$(myPrivKey)'

            - checkout: self
              clean: true
              fetchDepth: 0
              persistCredentials: true
              displayName: 'Checkout code'

            - script: |
                if [ "$(Build.Reason)" == "PullRequest" ]; then
                  # Explicitly fetch and checkout the PR's source branch
                  git fetch origin $(System.PullRequest.SourceBranch)
                  git checkout $(System.PullRequest.SourceBranch)
                  git pull --rebase origin $(System.PullRequest.SourceBranch)
                else
                  # For non-PR builds, just pull the latest changes on the current branch
                  git pull --rebase origin $(Build.SourceBranch)
                fi
              displayName: 'Sync with Remote Repository'
              condition: succeeded()

            - script: |
                echo "Fetching changed files..."

                git diff --name-only origin/main...HEAD | grep '^infrastructure/' > changed_files.txt
                echo "Changed files:"
                cat changed_files.txt

                # Define the regex pattern for the environments
                env_regex="($(environments))\$"

                # Extract directory paths, filter by environment, and ensure uniqueness
                #awk '{print $1}' changed_files.txt | xargs -I {} dirname {} | grep -P "$env_regex" | sort | uniq > changed_dirs.txt

                # Extract unique root/application/environment paths
                # Extract unique root/application/environment paths
                awk -F'/' -v envs="$env_regex" '
                {
                    for (i=1; i<=NF; i++) {
                        if ($i ~ envs) {
                            path = $1;
                            for (j=2; j<=i; j++) {
                                path = path "/" $j;
                            }
                            print path;
                            break;
                        }
                    }
                }' changed_files.txt | sort | uniq > changed_dirs.txt

                echo "Filtered directories with changes (matched by environment):"
                cat changed_dirs.txt

                if [ -s changed_dirs.txt ]; then
                  echo "Processing changes in the following directories..."

                  # Additional commands for processing directories
                else
                  echo "No changes detected in relevant environment directories."
                  exit 0
                fi

              displayName: 'List all Changed Directories'
              env:
                environments: $(environments)  # Passing variable correctly

            - template: deploy/apply_pr_checks.yaml
              parameters:
                basepath: .pipelines/infrastructure
