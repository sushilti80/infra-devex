variables:
  - group: azdevopsterraform
  - name: environments
    value: 'sand|devsand|waisand|docsand'

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'infrastructure/**/devsand/**'
      - 'infrastructure/**/sand/**'
      - 'infrastructure/**/*sand/**'
      - 'infrastructure/**/waisand/**'
      - 'infrastructure/**/docsand/**'
    exclude:
      - '_templates/**'
      - 'recycle-bin/**'

pr: none

stages:
  - stage: TerraformPlan
    displayName: 'Terraform Plan and Apply'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ApplyInfra
        displayName: 'Apply Infrastructure Changes'
        timeoutInMinutes: 120
        pool:
          name: example-agent-pool-1
        steps:

          - task: InstallSSHKey@0
            inputs:
              knownHostsEntry: '$(ssh_known_hosts)'
              sshPublicKey: '$(myPubKey)'
              sshKeySecureFile: 'id_rsa'

          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true
            displayName: 'Checkout Main Branch'

          - script: |
              echo "Syncing repository state after merge..."
              git fetch origin main
              git reset --hard origin/main

              echo "Previous commit: $(git rev-parse origin/main~1)"
              echo "Current commit: $(git rev-parse origin/main)"
            displayName: 'Synchronize Repository with Merged Main Branch'

          - script: |
              echo "Current commit SHA: $(Build.SourceVersion)"

              # Explicitly fetch the repository state
              git fetch --all

              # Get previous commit SHA accurately from git history
              PREV_COMMIT=$(git rev-parse $(Build.SourceVersion)^1)
              echo "Previous commit SHA: $PREV_COMMIT"

              # Show commits clearly in logs for debugging
              echo "Commit history:"
              git log --oneline -5

              # Confirm we have differences
              git diff --name-only $PREV_COMMIT $(Build.SourceVersion) | grep '^infrastructure/' > changed_files.txt

              git diff --diff-filter=A --name-only $PREV_COMMIT $(Build.SourceVersion) \
                | grep -E '^infrastructure/[A-Za-z0-9-]+/[A-Za-z0-9-]+/\.module-removals/[0-9]+\.json$' \
                > module_removal_requests.txt || true

              echo "Changed files detected:"
              cat changed_files.txt

              echo "Module removal requests detected:"
              cat module_removal_requests.txt

              awk -F'/' -v envs="$ENVIRONMENTS" '
              {
                  for (i=1; i<=NF; i++) {
                      if ($i ~ envs) {
                          path = $1;
                          for (j=2; j<=i; j++) path = path "/" $j;
                          print path;
                          break;
                      }
                  }
              }' changed_files.txt | sort -u > changed_dirs.txt

              echo "Directories filtered by environment (to be processed):"
              cat changed_dirs.txt

              if [ ! -s changed_dirs.txt ]; then
                echo "No relevant changes in environment directories. Skipping further steps."
                exit 0
              fi
            displayName: 'Detect Changed Directories (Robust)'
            env:
              ENVIRONMENTS: $(environments)


          - template: deploy/apply_pr_checks.yaml
            parameters:
              basepath: .pipelines/infrastructure
