name: "Deploy Custom Infrastructure"

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Enter Project Name (e.g., MyApp)"
        required: true
      environment:
        description: "Select Environment"
        required: true
        type: string
      modules:
        description: "Enter Modules (comma-separated, e.g., storageV2,keyvault,rbac)"
        required: true
      owner:
        description: "Enter the Owner Name (for tagging)"
        required: true
      cr:
        description: "Enter the Jira CR Number (for tracking)"
        required: false
      age:
        description: "Select project life"
        required: true
        type: choice
        options:
          - "3 days"
          - "1 month"
          - "3 months"
      terraform_branch:
        description: "Enter Terraform Module Branch (e.g., test-branch)"
        required: false
        default: "main"
      correlation_id:
        description: "Unique Correlation ID (for tracking runs in logs)"
        required: false
        default: "none"
      rbac_pairs:       # Add this block
        required: false
        type: string
        description: "Comma-separated RBAC pairs in format source|target|role"
      project_desc:
        description: "Enter Project description Name (e.g., app description)"
        required: false
      triggered_by:
        description: "Triggered by the self-service portal (if available)"
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  MODULES_REPO: ${{ vars.TERRAFORM_MODULES_REPO }}
  TERRAFORM_MODULES_REPO: ${{ vars.TERRAFORM_MODULES_REPO }}
  CATALOG_CONFIG_JSON: ${{ vars.CATALOG_CONFIG_JSON }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create catalog automation token
        id: catalog-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.catalog-app.outputs.token }}

      - name: Configure Git Authentication for Push
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Set Branch Name
        run: echo "BRANCH_NAME=deploy-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Capture Source Commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare shared Terragrunt entrypoint
        run: cp infrastructure/root.hcl infrastructure/terragrunt.hcl

      - name: Print Correlation ID
        if: ${{ github.event.inputs.correlation_id != 'none' }}
        run: |
          echo "🔗 Correlation ID: ${{ github.event.inputs.correlation_id }}"

      - name: Set Up Terragrunt
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -L "https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Process Modules
        run: |
          [[ "$MODULES_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Set TERRAFORM_MODULES_REPO to owner/repository"; exit 1; }
          MODULE_LIST="resourceGroups,${{ github.event.inputs.modules }}"

          mkdir -p ~/.ssh
          echo "${{ secrets.ACTIONS_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"

          IFS=',' read -r -a MODULE_ARRAY <<< "$MODULE_LIST"
          for module_instance in "${MODULE_ARRAY[@]}"; do
            # Trim leading and trailing whitespace from the module instance
            module_instance=$(echo "$module_instance" | xargs)

            # Extract the base module name (before the first dash)
            # e.g., "AppService-primary" -> modulename="AppService", folder="appservice-primary"
            modulename=$(echo "$module_instance" | sed 's/-.*$//')

            # Create lowercase folder name for the instance
            folder=$(echo "$module_instance" | tr '[:upper:]' '[:lower:]')

            PROJECT_NAME=$(echo "${{ github.event.inputs.project_name }}" | tr '[:upper:]' '[:lower:]')
            ENVIRONMENT=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]')

            MODULE_DIR="infrastructure/${PROJECT_NAME}/${ENVIRONMENT}/${folder}"
            mkdir -p "$MODULE_DIR"
            cd "$MODULE_DIR"

            echo "Running Terragrunt scaffolding for module: $modulename (instance: $module_instance)..."
            terragrunt scaffold "git::ssh://git@github.com/${MODULES_REPO}.git//azure/${modulename}?ref=${{ github.event.inputs.terraform_branch }}" || {
              echo "❌ Error: Terragrunt scaffolding failed for $modulename (instance: $module_instance)!"
              exit 1
            }

            [[ ! -f "terragrunt.hcl" ]] && {
              echo "❌ Error: terragrunt.hcl not generated for $modulename (instance: $module_instance)!"
              exit 1
            }

            cd -
          done

      - name: Reconcile Removed Modules
        id: reconcile
        env:
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          MODULES: ${{ github.event.inputs.modules }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          CORRELATION_ID: ${{ github.event.inputs.correlation_id }}
        run: |
          python3 .github/workflows/scripts/reconcile_custom_infra.py \
            --project "$PROJECT_NAME" \
            --environment "$ENVIRONMENT" \
            --modules "$MODULES" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "${{ github.run_id }}" \
            --correlation-id "$CORRELATION_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Inject RBAC into terragrunt.hcl
        env:
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          RBAC_PAIRS: ${{ github.event.inputs.rbac_pairs }}
        run: |
          project=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          environment=$(echo "$ENVIRONMENT" | tr '[:upper:]' '[:lower:]')
          if [[ -f "infrastructure/${project}/${environment}/rbac/terragrunt.hcl" ]]; then
            bash .github/workflows/scripts/generate_rbac.sh \
              "$PROJECT_NAME" \
              "$ENVIRONMENT" \
              "$RBAC_PAIRS"
          elif [[ -n "$RBAC_PAIRS" ]]; then
            echo "RBAC relationships require the RBAC module in the desired state." >&2
            exit 1
          else
            echo "RBAC module is not in the desired state; skipping generation."
          fi

      - name: Generate env.hcl File
        shell: bash
        run: |
          set -euo pipefail

          # Normalize inputs
          PROJECT_NAME=$(echo "${{ github.event.inputs.project_name }}" | tr '[:upper:]' '[:lower:]')
          ENVIRONMENT=$(echo "${{ github.event.inputs.environment }}"   | tr '[:upper:]' '[:lower:]')
          # Strip any surrounding double-quotes that callers may include in the values
          PROJECT_DESC=$(echo "${{ github.event.inputs.project_desc }}" | tr -d '"')
          OWNER=$(echo "${{ github.event.inputs.owner }}" | tr -d '"')
          ENV_HCL_PATH="infrastructure/${PROJECT_NAME}/${ENVIRONMENT}/env.hcl"
          mkdir -p "$(dirname "$ENV_HCL_PATH")"

          # 1) Write HCL with placeholder
          cat << EOF > "$ENV_HCL_PATH"
          locals {
            common_vars    = read_terragrunt_config(find_in_parent_folders("common.hcl"))
            envName        = "\${basename(dirname(get_original_terragrunt_dir()))}"
            parentdir      = "\${get_terragrunt_dir()}/../"
            prefix         = lower(basename(dirname(local.parentdir)))
            currentsubID   = local.common_vars.locals.subscriptions[local.envName]
            module_version = "${{ github.event.inputs.terraform_branch }}"
            location       = local.common_vars.locals.location
            alias          = local.common_vars.locals.alias

            app_metadata = {
              name        = "${{ github.event.inputs.project_name }}"
              description = "${PROJECT_DESC}"
              owner       = "${OWNER}"
              commit_sha  = "${{ github.sha }}"
              deployed_at = "DEPLOYMENT_TIME_TOKEN"
              cost_center = "self-service"
              lifecycle   = "experimental"
              environment = "${ENVIRONMENT}"
            }

            extra_tags = local.app_metadata
          }
          EOF

          # 2) Inject real timestamp
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s/DEPLOYMENT_TIME_TOKEN/${DEPLOY_TIME}/" "$ENV_HCL_PATH"

          # 3) Verify
          if [ -f "$ENV_HCL_PATH" ]; then
            echo "✅ Created $ENV_HCL_PATH at $DEPLOY_TIME"
            cat "$ENV_HCL_PATH"
          else
            echo "❌ Failed to create $ENV_HCL_PATH"
            exit 1
          fi

      - name: Generate Per-Project Metadata File (with meta and version)
        shell: bash
        run: |
          set -euo pipefail

          # 1) Normalize inputs
          project=$(echo "${{ github.event.inputs.project_name }}" | tr '[:upper:]' '[:lower:]')
          environment=$(echo "${{ github.event.inputs.environment }}"   | tr '[:upper:]' '[:lower:]')
          modules="${{ github.event.inputs.modules }}"
          rbac_pairs="${{ github.event.inputs.rbac_pairs }}"
          commit_sha="${{ github.sha }}"

          # 2) Paths
          env_hcl="infrastructure/${project}/${environment}/env.hcl"
          out="docs/metadata/${project}-${environment}.json"
          mkdir -p "$(dirname "$out")"
          echo "📦 Generating metadata at $out"

          # 3) Install HCL parser
          pip install --quiet python-hcl2==8.1.2

          # 4) Export for Python
          export project environment modules rbac_pairs commit_sha env_hcl out

          # 5) Inline Python: load existing JSON, merge new info, compute version, write
          python3 << 'EOF'
          import os, sys, json, hcl2

          json_path = os.environ['out']
          hcl_path  = os.environ['env_hcl']

          # Load or initialize JSON
          if os.path.isfile(json_path):
              with open(json_path, 'r') as f:
                  data = json.load(f)
          else:
              data = {
                  "project":     os.environ['project'],
                  "environment": os.environ['environment'],
                  "modules":     [],
                  "rbac_pairs":  [],
                  "commitshas":  [],
                  "version":     "0.0",
                  "meta":        {}
              }

          # Ensure required keys exist
          data.setdefault('commitshas', [])
          data.setdefault('version', '0.0')

          # Parse env.hcl and extract app_metadata
          if not os.path.isfile(hcl_path):
              print(f"❌ env.hcl not found at {hcl_path}", file=sys.stderr)
              sys.exit(1)
          with open(hcl_path, 'r') as f:
              hcl_data = hcl2.load(f)

          locals_block = hcl_data.get('locals')
          first_locals = locals_block[0] if isinstance(locals_block, list) and locals_block else locals_block
          app_meta = (first_locals.get('app_metadata') if first_locals else {})

          app_meta = {
              key: value[1:-1]
              if isinstance(value, str) and len(value) >= 2 and value.startswith('"') and value.endswith('"')
              else value
              for key, value in app_meta.items()
          }

          def desired_values(raw):
              return list(dict.fromkeys(value.strip() for value in raw.split(',') if value.strip()))

          # Submitted values are the complete desired state, not additions.
          data['modules'] = desired_values(os.environ['modules'])
          data['rbac_pairs'] = desired_values(os.environ['rbac_pairs'])

          # Append commit SHA
          sha = os.environ['commit_sha']
          if sha and sha not in data['commitshas']:
              data['commitshas'].append(sha)

          # Compute version = "<count>.0"
          data['version'] = f"{len(data['commitshas'])}.0"

          # Update meta
          data['meta'] = app_meta

          # Write back JSON
          with open(json_path, 'w') as f:
              json.dump(data, f, indent=2)
          print(f"✅ Metadata file updated at {json_path}")
          EOF

      - name: Commit & Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH_NAME"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy custom infra for ${{ github.event.inputs.project_name }} and update catalog.json"
          git push --set-upstream origin "$BRANCH_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        env:
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          CR: ${{ github.event.inputs.cr }}
          MODULES: ${{ github.event.inputs.modules }}
          REMOVED_MODULES: ${{ steps.reconcile.outputs.removed_modules }}
          GH_TOKEN: ${{ steps.catalog-app.outputs.token }}
          RBAC_PAIRS: ${{ github.event.inputs.rbac_pairs }}
          OWNER: ${{ github.event.inputs.owner }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > pr-body.md <<EOF
          Auto-generated deployment PR for:
          - **Project:** ${PROJECT_NAME}
          - **Environment:** ${ENVIRONMENT}
          - **Desired modules:** ${MODULES:-none}
          - **Removed modules:** ${REMOVED_MODULES:-none}
          - **Desired RBAC relationships:** ${RBAC_PAIRS:-none}
          - **Owner:** ${OWNER}
          - **Triggered by:** ${{ github.actor }}
          - **Requested by:** ${TRIGGERED_BY:-unknown}
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Deploy ${PROJECT_NAME} to ${ENVIRONMENT} (${CR})" \
            --body-file pr-body.md
