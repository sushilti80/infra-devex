name: Secret Sync Tests

on:
  pull_request:
    paths:
      - '.github/scripts/secret-sync/**'
      - '.github/workflows/secrets-sync.yml'
      - '.github/workflows/secret-sync-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/secret-sync/**'
      - '.github/workflows/secrets-sync.yml'
      - '.github/workflows/secret-sync-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate secret-sync scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --disable-pip-version-check -r .github/scripts/secret-sync/requirements.txt

      - name: Compile secret-sync scripts
        run: python -m py_compile .github/scripts/secret-sync/*.py

      - name: Run secret-sync tests
        run: python -m unittest discover -s .github/scripts/secret-sync -p 'test_*.py'
