name: "Deploy with App Template"

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Enter Project Name (e.g., my-new-project)"
        required: true
      owner:
        description: "Enter the Owner Name (for tagging)"
        required: true
      template_application:
        description: "Select Application Template"
        required: true
        type: choice
        options:
          - webapp-storage
          - webapp-full
          - webapp-basic
      jira:
        description: "Enter the Jira/CR Number (for optional tracking)"
        required: false
      age:
        description: "Select project life"
        required: true
        type: choice
        options:
          - "3 days"
          - "1 month"
          - "3 months"
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      correlation_id:
        description: "Unique Correlation ID (for tracking)"
        required: false
        default: "none"
      project_desc:
        description: "Enter Project description Name (e.g., app description)"
        required: false
      triggered_by:
        description: "Triggered by the self-service portal (if available)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create catalog automation token
        id: catalog-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout Service Catalog Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.catalog-app.outputs.token }}

      - name: Set Up SSH Key for Infrastructure-Live Repository
        run: |
          echo "🔑 Setting up SSH key for infrastructure-live repository..."
          mkdir -p ~/.ssh
          echo "${{ secrets.INFRA_LIVE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ steps.catalog-app.outputs.token }}

      - name: Print Correlation ID
        if: ${{ github.event.inputs.correlation_id != 'none' }}
        run: |
          echo "🔗 Correlation ID: ${{ github.event.inputs.correlation_id }}"

      - name: Copy Files from Template
        run: |
          PROJECT_NAME=$(echo "${{ github.event.inputs.project_name }}" | tr '[:upper:]' '[:lower:]')
          TEMPLATE_APP=$(echo "${{ github.event.inputs.template_application }}" | tr '[:upper:]' '[:lower:]')
          ENVIRONMENT=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]')

          # Debug
          echo "🔍 PROJECT_NAME: $PROJECT_NAME"
          echo "🔍 TEMPLATE_APP: $TEMPLATE_APP"

          # Define template path mappings
          declare -A TEMPLATE_PATHS
          TEMPLATE_PATHS["webapp-storage"]="_templates/webapp-storage"
          TEMPLATE_PATHS["webapp-full"]="_templates/webapp-full"
          TEMPLATE_PATHS["webapp-basic"]="_templates/webapp-basic"

          SOURCE_PATH="${TEMPLATE_PATHS[$TEMPLATE_APP]}"
          TARGET_PATH="infrastructure/${PROJECT_NAME}/${ENVIRONMENT}"

          echo "🔍 SOURCE_PATH: $SOURCE_PATH"
          echo "🔍 TARGET_PATH: $TARGET_PATH"

          echo "📂 Copying files from $SOURCE_PATH to $TARGET_PATH..."
          mkdir -p "$TARGET_PATH"
          cp -R "$SOURCE_PATH/." "$TARGET_PATH/"
          echo "✅ Copied files:"
          ls -R "$TARGET_PATH"

      - name: Generate template deployment metadata
        env:
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          PROJECT_DESC: ${{ github.event.inputs.project_desc }}
          OWNER: ${{ github.event.inputs.owner }}
        run: node .github/workflows/scripts/generate_template_metadata.mjs
      - name: Commit & Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          BRANCH_NAME="deploy-${{ github.run_id }}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

          PROJECT_NAME=$(echo "${{ github.event.inputs.project_name }}" | tr '[:upper:]' '[:lower:]')
          ENVIRONMENT=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          TARGET_PATH="infrastructure/${PROJECT_NAME}/${ENVIRONMENT}"
          echo "🔍 PROJECT_NAME: $PROJECT_NAME"
          echo "🔍 TARGET_PATH: $TARGET_PATH"

          if [[ ! -d "$TARGET_PATH" ]]; then
            echo "❌ Error: TARGET_PATH ($TARGET_PATH) does not exist."
            exit 1
          fi

          # Add both the target folder and the updated catalog.json file
          git add "$TARGET_PATH" docs/catalog.json
          git status
          if git diff --cached --quiet; then
            echo "✅ No changes detected, skipping commit."
            exit 0
          fi

          git commit -m "Self-Service: Added ${{ github.event.inputs.template_application }} template for ${{ github.event.inputs.project_name }} (Owner: ${{ github.event.inputs.owner }})"
          git push origin $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.catalog-app.outputs.token }}
        run: |
          ENVIRONMENT=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          echo "📦 Creating deployment PR..."
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Self-Service: Deploy ${{ github.event.inputs.template_application }} as base infrastructure template for ${{ github.event.inputs.project_name }}   ${{ github.event.inputs.jira }}" \
            --body "🚀 Auto-generated deployment PR for:\n
              - **Project:** ${{ github.event.inputs.project_name }}\n
              - **Owner:** ${{ github.event.inputs.owner }}\n
              - **Template Used:** ${{ github.event.inputs.template_application }} (Sand)\n
              - **New Environment:** ${ENVIRONMENT}\n
              - **Triggered by:** ${{ github.actor }}\n
              - **Requested by:** ${{ inputs.triggered_by }}"
