# Secret Self-Service: post-merge sync of encrypted secret files to Azure Key Vault.
#
# The Self-Service portal opens a pull request containing <vaultDir>/secrets.enc.yaml,
# a plain YAML map whose values are independently encrypted per-value SOPS blobs.
# After that PR merges, this workflow resolves the authoritative Azure Key Vault
# from the vault's own Terragrunt configuration and writes each secret.
#
# Fail-closed ordering is deliberate. Nothing is decrypted and no Azure credential
# is acquired until the changed paths have been validated, and no decryption
# happens until the vault has been resolved from Terragrunt *and* confirmed to
# exist in the resolved subscription.
#
# Security notes:
#   * OIDC only - there is no client secret anywhere in this workflow.
#   * `set -x` is never used; it would echo file contents into the job log.
#   * Plaintext only ever exists in a 0600 file inside a 0700 temporary directory,
#     which is removed on success, on failure and on signals.
#   * Only non-secret diagnostics are logged: path, vault name, vault resource ID,
#     secret name, commit SHA, run ID and the OIDC principal's object ID (a
#     directory identifier, not a credential - safe to log, useful for
#     debugging RBAC/"access denied" failures against Key Vault).

name: Secrets Sync

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**/keyvault/secrets.enc.yaml'
      - 'infrastructure/**/keyvault[0-9]*/secrets.enc.yaml'
      - 'infrastructure/**/secrets.enc.yaml'
  workflow_dispatch:
    inputs:
      file_path:
        description:
          Exactly one repo-relative path to a secrets.enc.yaml file to sync.
          A manual run never processes every encrypted file implicitly.
        required: true
        type: string

# Least privilege: read the tree, mint an OIDC token, nothing else.
permissions:
  contents: read
  id-token: write

concurrency:
  # Serialise writes to Key Vault; never cancel a run mid-write.
  group: secrets-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  SOPS_VERSION: v3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
  SCRIPT_DIR: .github/scripts/secret-sync

jobs:
  sync:
    name: Sync encrypted secrets to Key Vault
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The CI identity's federated credential is scoped to this GitHub
    # Environment, not to a branch: the OIDC subject GitHub mints is
    # `repo:<org>/<repo>:environment:workflow`. Without this key the token
    # carries a branch subject instead and Entra rejects it (AADSTS700213).
    environment: workflow

    steps:
      # 1. Check out the merged repository content.
      - name: Checkout merged content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Need the previous commit as well so a push diff is possible.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      # 2. Decide which files this run may touch. Runs before Azure login and
      #    uses only the standard library, so an invalid path is rejected while
      #    the job still holds no credential.
      - name: Select and validate changed secret files
        id: select
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}
          INPUT_FILE_PATH: ${{ inputs.file_path }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 "${SCRIPT_DIR}/select_files.py" \
            --mode "${MODE}" \
            --repo-root . \
            --file-path "${INPUT_FILE_PATH:-}" \
            --before "${BEFORE_SHA:-}" \
            --sha "${CURRENT_SHA}" \
            --output "${RUNNER_TEMP}/selected-files.txt"

      - name: Install pinned Python dependencies
        if: steps.select.outputs.count != '0'
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --no-deps --disable-pip-version-check \
            -r "${SCRIPT_DIR}/requirements.txt"

      # 3. Install a pinned SOPS and verify its checksum before it is executed.
      - name: Install pinned SOPS
        if: steps.select.outputs.count != '0'
        run: |
          set -euo pipefail
          asset="sops-${SOPS_VERSION}.linux.amd64"
          url="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/${asset}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/sops" "${url}"
          echo "${SOPS_SHA256}  ${RUNNER_TEMP}/sops" > "${RUNNER_TEMP}/sops.sha256"
          # Verify before the binary is ever made executable or run.
          sha256sum --check --strict "${RUNNER_TEMP}/sops.sha256"
          chmod 0755 "${RUNNER_TEMP}/sops"
          sudo mv "${RUNNER_TEMP}/sops" /usr/local/bin/sops
          sops --version --disable-version-check

      # 4. Ensure the Azure CLI is present before login/keyvault commands run.
      - name: Setup Environment (Azure CLI)
        if: steps.select.outputs.count != '0'
        uses: ./.github/actions/setup-environment
        with:
          install-jq: 'false'
          install-miller: 'false'
          install-azure-cli: 'true'

      # 5. Authenticate with the CI identity's OIDC federated credential.
      #    No client secret: azure/login uses the id-token minted above.
      - name: Azure login (OIDC)
        if: steps.select.outputs.count != '0'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Confirm the login is federated, not a secret
        if: steps.select.outputs.count != '0'
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Fails the run if a client secret was somehow used instead of OIDC.
          if [ -n "${ARM_CLIENT_SECRET:-}${AZURE_CLIENT_SECRET:-}" ]; then
            echo "::error::a client secret is present; this workflow must use OIDC only"
            exit 1
          fi
          az account show --query '{tenantId:tenantId,user:user.name,type:user.type}' \
            --output json

          # Best-effort: capture the signed-in identity's object (principal) ID
          # so an "access denied" failure later can be matched against Key
          # Vault RBAC assignments without re-running the job. This is a
          # directory identifier, not a credential - safe to log. It is not
          # fatal if the lookup fails (e.g. no Graph read permission).
          principal_id=$(az ad sp show --id "${ARM_CLIENT_ID}" --query id --output tsv 2>/dev/null) || principal_id=""
          if [ -n "${principal_id}" ]; then
            echo "principalObjectId=${principal_id}"
          else
            echo "note: could not resolve principal object ID (no Graph read permission or lookup failed)"
          fi

      # 6-12. Resolve each vault from Terragrunt, confirm it exists, then sync.
      - name: Resolve vaults and sync secrets
        if: steps.select.outputs.count != '0'
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Never `set -x` here: it would echo encrypted blocks and file contents.

          failures=0
          while IFS= read -r secrets_file; do
            [ -n "${secrets_file}" ] || continue
            echo "::group::${secrets_file}"

            # Resolve exactly one Azure Key Vault from the vault's own Terragrunt
            # configuration. Missing, ambiguous or path-mismatched -> non-zero.
            if ! resolution=$(python3 "${SCRIPT_DIR}/resolve_vault.py" \
                  --repo-root . --secrets-file "${secrets_file}"); then
              echo "::error::could not resolve a Key Vault for ${secrets_file}"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            vault_name=$(printf '%s' "${resolution}" | jq -r '.keyVaultName')
            subscription=$(printf '%s' "${resolution}" | jq -r '.subscriptionId // empty')
            source_ref=$(printf '%s' "${resolution}" | jq -r '.vaultNameSource')
            echo "resolved vault=${vault_name} from ${source_ref}"

            # Confirm the resolved vault really exists, and take the resource ID
            # from Azure rather than trusting a string built in the repository.
            # This is the backstop that catches a resolver error *before*
            # anything is decrypted.
            #
            # Most vaults resolve a subscription from their env.hcl, which pins
            # the lookup and rules out a same-name vault in another
            # subscription. A few (e.g. infrastructure/kong/*) genuinely do not
            # declare one; there the lookup falls back to the subscriptions this
            # identity can see, and least-privilege RBAC remains the boundary.
            if [ -n "${subscription}" ]; then
              vault_id=$(az keyvault show --name "${vault_name}" \
                --subscription "${subscription}" --query id --output tsv 2>/dev/null) \
                || vault_id=""
            else
              echo "note: no subscription declared in Terragrunt for this vault"
              vault_id=$(az keyvault show --name "${vault_name}" \
                --query id --output tsv 2>/dev/null) || vault_id=""
            fi
            if [ -z "${vault_id}" ]; then
              echo "::error::resolved vault ${vault_name} was not found or is outside this identity's scope"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi
            echo "confirmed vaultResourceId=${vault_id}"

            if ! python3 "${SCRIPT_DIR}/sync_secrets.py" \
                  --secrets-file "${secrets_file}" \
                  --vault-name "${vault_name}" \
                  --vault-resource-id "${vault_id}" \
                  --commit-sha "${COMMIT_SHA}" \
                  --run-id "${RUN_ID}"; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/selected-files.txt"

          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} secret file(s) failed to sync"
            exit 1
          fi

      - name: Azure logout
        if: always()
        run: az logout --only-show-errors 2>/dev/null || true
